# Environnement local de Hypeclip. Lancement et détails : docs/setup.md
#
# Sans profil : l'infrastructure (Postgres, Redis, NATS, Mailpit).
# Profil `demo` : ajoute le monitoring (Prometheus, Grafana).
# Les services applicatifs rejoindront les profils `dev` et `demo` une fois les apps créées (T1).
#
# Les ports ne sont exposés que sur 127.0.0.1 : rien n'est joignable depuis le réseau local.

name: hypeclip

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hypeclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-hypeclip}
      # Un rôle par service, propriétaire de son seul schéma (voir infra/postgres/init).
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?à définir dans .env}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:?à définir dans .env}
      DETECTION_DB_PASSWORD: ${DETECTION_DB_PASSWORD:?à définir dans .env}
      CLIP_DB_PASSWORD: ${CLIP_DB_PASSWORD:?à définir dans .env}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?à définir dans .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    # noeviction est exigé par BullMQ : une clé de job ne doit jamais être évincée.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?à définir dans .env}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    # -js : JetStream, -m : endpoint de monitoring (/healthz, /varz), -sd : stockage JetStream.
    command: [-js, -sd, /data, -m, '8222']
    ports:
      - 127.0.0.1:${NATS_PORT:-4222}:4222
      - 127.0.0.1:${NATS_MONITORING_PORT:-8222}:8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [demo]
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.3
    profiles: [demo]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?à définir dans .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
